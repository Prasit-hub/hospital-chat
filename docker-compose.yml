# ฐานข้อมูล PostgreSQL สำหรับพัฒนาในเครื่อง: docker compose up -d
# เปลี่ยนพอร์ตได้ถ้า 5432 ชนกับโปรแกรมอื่น: DB_PORT=5433 docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospchat
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
